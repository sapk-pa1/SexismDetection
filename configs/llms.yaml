# Prompted LLMs (frozen 2026-10-20): 15 open-weight instruct models, <= 8B total params (card figure)
# Revisions are commit shas resolved from the Hub on 2026-10-20; gated/licence from the Hub API
# Optional per-model keys: prefill (added after the template prefill), chat_kwargs (apply_chat_template),
# fp8_dequantize (FP8-only checkpoints on A100), trust_remote_code (default false),
# blocked (reason the model must not be run yet)
# vram_gb: scheduling estimate = Hub safetensors size at the pinned revision + 3 GB headroom, rounded up
