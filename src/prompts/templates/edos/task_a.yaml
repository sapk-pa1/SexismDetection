version: 1
# Definition from Kirk et al. 2023, SemEval-2023 Task 10 (arXiv 2303.04222). TODO: our copy of the quote was excerpted; check the full wording
source: Kirk et al. 2023, SemEval-2023 Task 10
system: You are an expert annotator who labels social media posts for sexism.
yes_no: |-
  Definition of {name}: {definition}

  Post: """{text}"""

  Is this post {name} according to the definition? Answer with Yes or No only.
json: |-
  Label the post below. Fields:
  {fields}

  Post: """{text}"""

  Reply with a JSON object only.
prefill: ""  # grammar starts after the prefill, so it must not contain JSON
labels:
  sexist:
    name: sexist
    definition: >-
      Any abuse, implicit or explicit, that is directed towards women based on their
      gender, or on the combination of their gender with one or more other identity
      attributes.
