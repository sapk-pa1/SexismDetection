version: 1
# Variant T1 of edos/task_a.yaml: rewording 1 of the system and question sentences (docs/12 §3.6); definitions verbatim
# Frozen with docs/12-protocol-addendum.md; its sha256 is in configs/prompt_variants.lock
source: Kirk et al. 2023, SemEval-2023 Task 10
system: You are a careful content moderator who identifies sexism in social media posts.
yes_no: |-
  Definition of {name}: {definition}

  Post: """{text}"""

  Using the definition above, decide whether this post is {name}. Reply with Yes or No only.
json: |-
  Label the post below. Fields:
  {fields}

  Post: """{text}"""

  Reply with a JSON object only.
prefill: ""  # grammar starts after the prefill, so it must not contain JSON
labels:
  sexist:
    name: sexist
    definition: >-
      Any abuse, implicit or explicit, that is directed towards women based on their
      gender, or on the combination of their gender with one or more other identity
      attributes.
