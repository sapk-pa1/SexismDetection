version: 1
# Definitions from Kirk et al. 2023, SemEval-2023 Task 10, taxonomy (arXiv 2303.04222). TODO: threats was excerpted in our copy; check the full wording
# TODO: wording assumes nothing about gold-sexist vs end-to-end evaluation (still undecided)
source: Kirk et al. 2023, SemEval-2023 Task 10
system: You are an expert annotator who labels social media posts for sexism.
options: |-
  Which category of sexism best describes this post?

  {options}

  Post: """{text}"""

  Answer with the letter of one category only.
json: |-
  Label the post below with exactly one category. Categories:
  {fields}

  Post: """{text}"""

  Reply with a JSON object only.
prefill: ""  # grammar starts after the prefill, so it must not contain JSON
labels:
  threats:
    name: threats, plans to harm and incitement
    definition: >-
      Language where an individual expresses intent and/or encourages others to take
      action against women.
  derogation:
    name: derogation
    definition: Language which explicitly derogates, dehumanises, demeans or insults women.
  animosity:
    name: animosity
    definition: Language which expresses implicit or subtle sexism, stereotypes or descriptive statements.
  prejudiced_discussions:
    name: prejudiced discussions
    definition: Language which denies the existence of discrimination, and justifies sexist treatment.
